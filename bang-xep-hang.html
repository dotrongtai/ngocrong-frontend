<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bảng Xếp Hạng - Ngọc Rồng Hoa Mai</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>

  <style>
    .thong-bao-bxh {
      background: var(--the-nen);
      border: 1px solid var(--vien);
      border-radius: 16px;
      padding: 48px 28px;
      text-align: center;
      box-shadow: 0 8px 24px var(--bong-nhe);
    }
    .thong-bao-bxh i {
      font-size: 42px;
      color: var(--vang);
      margin-bottom: 18px;
      display: block;
    }
    .thong-bao-bxh h3 {
      font-size: 20px;
      font-weight: 800;
      color: var(--vang);
      margin-bottom: 10px;
    }
    .thong-bao-bxh p {
      font-size: 15.5px;
      color: var(--chu-mo);
      line-height: 1.7;
      max-width: 560px;
      margin: 0 auto;
    }
    .thong-bao-bxh .npc {
      color: var(--chu);
      font-weight: 800;
    }
  </style>
</head>
<body>

  <div class="apricot-falling-container" id="mainApricotContainer"></div>

  <div class="container">
    <div id="header-placeholder"></div>

    <div class="main-content">

      <div class="hero-banner" style="padding:32px 20px;">
        <h2><i class="fa-solid fa-ranking-star"></i> BẢNG XẾP HẠNG</h2>
        <p>Top cư dân dẫn đầu máy chủ Ngọc Rồng Hoa Mai.</p>
      </div>

      <div class="thong-bao-bxh">
        <i class="fa-solid fa-circle-info"></i>
        <h3>Bảng xếp hạng mùa 2</h3>
        <p>
          Người chơi vui lòng vào game, tìm NPC <span class="npc">Toribot</span> ở các làng để xem bảng xếp hạng.
        </p>
      </div>

    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var khung = document.getElementById('mainApricotContainer');
      if (khung) {
        for (var i = 0; i < 18; i++) {
          var hoa = document.createElement('div');
          hoa.className = 'apricot-flower';
          hoa.style.left = Math.random() * 100 + 'vw';
          hoa.style.animationDuration = (Math.random() * 3 + 4) + 's';
          hoa.style.animationDelay = (Math.random() * 5) + 's';
          hoa.style.transform = 'scale(' + (Math.random() * 0.6 + 0.6) + ')';
          khung.appendChild(hoa);
        }
      }
    });
  </script>

  <script src="js/auth.js"></script>
</body>
</html>
